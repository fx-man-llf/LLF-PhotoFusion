<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLF PhotoFusion</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1f2328; --muted:#646b75; --line:#dfe2e6;
  --accent:#0b6bcb; --accent-ink:#fff; --accent-soft:#e6f0fb;
  --ok:#1f8a4c; --warn:#c77700; --bad:#c62f2f; --ref:#0b6bcb;
  --canvas:#e7e9ec; --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Noto Sans","Noto Sans JP","Noto Sans CJK JP",Ubuntu,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header .logo{width:40px;height:40px;object-fit:contain;display:block}
header .free{font-size:12px;color:#1f6f3f;background:#eaf6ee;border:1px solid #c7e6d2;border-radius:999px;padding:3px 10px;white-space:nowrap}
.credits{border-top:1px solid var(--line);padding:10px 16px 12px;font-size:12px;color:var(--muted);line-height:1.5;background:#fafbfc}
.credits .lic{color:var(--ink);font-weight:600}
.credits a{color:var(--accent);text-decoration:none}
.credits a:hover{text-decoration:underline}
.credits .brand{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.credits .brand img{width:22px;height:22px;object-fit:contain}
header .sub{color:var(--muted);font-size:13px}
header .sp{flex:1}
main{flex:1;display:flex;min-height:0}
aside{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.steps{overflow:auto;padding:14px 16px 20px;flex:1}
.step{margin-bottom:18px}
.step h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px;font-weight:650}
.step h2 .n{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:12px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:#b9c0c8;background:#fafbfc}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.block{width:100%;padding:10px 12px}
.btn.small{padding:5px 8px;font-size:13px}
.btn.icon{width:34px;height:34px;padding:0;font-size:17px}
.drop{border:1.5px dashed #b8c1cc;border-radius:var(--radius);padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:#fafbfc}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop b{color:var(--ink)}
.list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item img{width:54px;height:40px;object-fit:contain;background:#eef0f2;border-radius:4px;flex:none}
.item .meta{flex:1;min-width:0}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550;font-size:13px}
.item .st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.ref{background:var(--ref)} .dot.ok{background:var(--ok)} .dot.man{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.wait{background:#9aa3ad}
.item .x{border:none;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px}
.item .x:hover{background:#f1f2f4;color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=number],select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;margin-bottom:10px;cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.quality{font-size:12.5px;background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
.quality .good{color:var(--ok);font-weight:600}
.quality .mid{color:var(--warn);font-weight:600}
.result{border:1px solid #bfe3cc;background:#f1faf4;border-radius:var(--radius);padding:10px 12px;margin-top:10px;font-size:13px}
.result b{display:block;margin-bottom:3px;word-break:break-all}
.result .row{margin-top:8px;flex-wrap:wrap}
.error{border:1px solid #f0c2c2;background:#fdf2f2;color:#8a1f1f;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
section.view{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:inline-flex;background:#eef0f3;border-radius:9px;padding:3px}
.tabs button{border:none;background:none;font:inherit;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.toolbar .lbl{color:var(--muted);font-size:13px}
.stage{flex:1;position:relative;background:var(--canvas);min-height:0;overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
canvas#cv.dragging{cursor:grabbing}
#pv{position:absolute;inset:0;overflow:auto;display:none;background:var(--canvas)}
#pv img{display:block;margin:auto;max-width:none}
#pv.fit img{max-width:calc(100% - 32px);max-height:calc(100% - 32px);position:absolute;inset:0;margin:auto;box-shadow:0 2px 12px rgba(0,0,0,.15);background:#fff}
#pv.full img{margin:16px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none}
.empty .big{font-size:18px;color:var(--ink);font-weight:600;margin-bottom:6px}
.legend{position:absolute;left:12px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.overlay{position:absolute;inset:0;background:rgba(243,244,246,.7);display:none;place-items:center;z-index:5}
.overlay .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;width:min(440px,90%);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.overlay .msg{font-weight:600;margin-bottom:10px;min-height:20px}
.bar{height:8px;background:#e7eaee;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.overlay .row{justify-content:space-between;margin-top:10px;color:var(--muted);font-size:13px}
.dropfull{position:fixed;inset:0;background:rgba(11,107,203,.12);border:3px dashed var(--accent);display:none;place-items:center;z-index:20;font-size:20px;color:var(--accent);font-weight:600}
.langsel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 4px 0 8px;background:#fff;cursor:pointer}
.langsel select{border:none;padding:6px 4px;width:auto;background:transparent;cursor:pointer}
.langsel:focus-within{border-color:var(--accent)}
@media (max-width:820px){aside{width:280px}header .sub,header .free{display:none}}
</style>
</head>
<body>
<header>
  <img class="logo" src="/logo.png" alt="LLF">
  <h1>LLF PhotoFusion</h1>
  <span class="sub" data-i="subtitle"></span>
  <span class="sp"></span>
  <span class="free" data-i="free_badge" data-it="free_title"></span>
  <button class="btn small" id="bClear" data-i="new_project" data-it="new_project_title"></button>
  <label class="langsel" title="Langue / Language / 言語">
    <span aria-hidden="true">🌐</span>
    <select id="lang" aria-label="Langue / Language / 言語">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </label>
</header>
<main>
<aside>
  <div class="steps">
    <div class="step">
      <h2><span class="n">1</span><span data-i="s_images"></span></h2>
      <div class="drop" id="drop" data-ih="drop_html"></div>
      <input type="file" id="file" multiple hidden accept=".jpg,.jpeg,.jpe,.png,.tif,.tiff,.bmp,.webp,.jp2,.cr2,.cr3,.nef,.nrw,.arw,.srf,.sr2,.dng,.orf,.rw2,.raf,.pef,.srw,.raw,.erf,.kdc,.3fr,.mef,.mos,.x3f,.iiq,.rwl">
      <div class="list" id="list"></div>
    </div>
    <div class="step">
      <h2><span class="n">2</span><span data-i="s_assemble"></span></h2>
      <button class="btn primary block" id="bAlign" data-i="b_align" disabled></button>
      <p class="hint" data-i="hint_align"></p>
      <div id="quality"></div>
    </div>
    <div class="step">
      <h2><span class="n">3</span><span data-i="s_settings"></span></h2>
      <div class="field">
        <label for="rot" data-i="l_rot"></label>
        <div class="row"><input type="number" id="rot" value="0" step="0.1" min="-45" max="45"><button class="btn small" id="bPrev" data-i="b_prev" data-it="b_prev_title" disabled></button></div>
      </div>
      <label class="check"><input type="checkbox" id="crop"> <span data-i="l_crop"></span></label>
      <div class="field">
        <label for="bg" data-i="l_bg"></label>
        <select id="bg"><option value="white" data-i="bg_white"></option><option value="black" data-i="bg_black"></option></select>
      </div>
      <div class="field">
        <label for="fmt" data-i="l_fmt"></label>
        <select id="fmt">
          <option value="auto" data-i="fmt_auto"></option>
          <option value="tif" data-i="fmt_tif"></option>
          <option value="png" data-i="fmt_png"></option>
          <option value="jpg" data-i="fmt_jpg"></option>
        </select>
      </div>
      <div class="field">
        <label for="name" data-i="l_name"></label>
        <input type="text" id="name" data-ip="ph_auto">
      </div>
      <div class="field">
        <label for="dir" data-i="l_dir"></label>
        <input type="text" id="dir">
      </div>
    </div>
    <div class="step">
      <h2><span class="n">4</span><span data-i="s_merge"></span></h2>
      <button class="btn primary block" id="bMerge" data-i="b_merge" disabled></button>
      <p class="hint" data-i="hint_merge"></p>
      <div id="result"></div>
      <div id="err"></div>
    </div>
  </div>
  <div class="credits">
    <div class="brand"><img src="/logo.png" alt=""><span class="lic" data-i="credits_free"></span></div>
    © 2026 LLF PhotoFusion —
    <a href="https://www.laludotheque.fr" target="_blank" rel="noopener">laludotheque.fr</a> ·
    <a href="https://www.lalogitheque.fr" target="_blank" rel="noopener">lalogitheque.fr</a>
  </div>
</aside>
<section class="view">
  <div class="toolbar">
    <div class="tabs"><button id="tLay" class="on" data-i="tab_lay"></button><button id="tPrev" data-i="tab_prev"></button></div>
    <span class="sep"></span>
    <span id="selTools" class="row" style="gap:6px">
      <span class="lbl" id="selName"></span>
      <button class="btn icon" id="bRotL" data-it="rot_l" disabled>⟲</button>
      <button class="btn icon" id="bRotR" data-it="rot_r" disabled>⟳</button>
      <button class="btn small" id="bRef" data-i="b_ref" data-it="b_ref_title" disabled></button>
    </span>
    <span class="sp" style="flex:1"></span>
    <button class="btn small" id="bFit" data-i="b_fit" data-it="b_fit_title"></button>
    <button class="btn small" id="b100" data-it="b_100_title" style="display:none">100 %</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="pv" class="fit"><img id="pimg" alt=""><div class="empty" id="pvEmpty"><div><div class="big" data-i="pv_empty_big"></div><span data-i="pv_empty_txt"></span></div></div></div>
    <div class="empty" id="empty"><div><div class="big" data-i="empty_big"></div><span data-i="empty_txt"></span></div></div>
    <div class="legend" id="legend" style="display:none">
      <span><span class="dot ref"></span><span data-i="st_ref"></span></span><span><span class="dot ok"></span><span data-i="st_aligned"></span></span>
      <span><span class="dot man"></span><span data-i="st_manual"></span></span><span><span class="dot bad"></span><span data-i="st_notfound"></span></span><span><span class="dot wait"></span><span data-i="st_pending"></span></span>
      <span data-i="lg_help"></span>
    </div>
    <div class="overlay" id="ov"><div class="box"><div class="msg" id="ovMsg">…</div><div class="bar"><i id="ovBar"></i></div><div class="row"><span id="ovPct">0 %</span><button class="btn small" id="bCancel" data-i="cancel"></button></div></div></div>
  </div>
</section>
</main>
<div class="dropfull" id="dropfull" data-i="dropfull"></div>

  cancel:"キャンセル", dropfull:"ドロップして画像を追加", remove:"削除", ref_suffix:"（基準）",
  q_prec:"継ぎ目の精度：{n} か所の重なりで平均 {v} ピクセル。",
  q_bad:"{n} 枚の画像が見つかりません。だいたいの位置に置いてから、もう一度実行してください。",
  q_all:"すべての画像が配置されました。",
  open_folder:"フォルダーを開く", download:"ダウンロード", mb:"MB",
  importing:"{name} を読み込み中（{k}/{n}）…", reading:"{name} を解析中（{k}/{n}）…", import_fail:"{name} を読み込めませんでした",
  confirm_clear:"すべての画像を削除しますか？", invalid:"無効な応答です", err_code:"エラー {c}"
 }
};
let LANG = 'fr';
function t(key, p){ let s = (STR[LANG] && STR[LANG][key]) || STR.fr[key] || key;
  if(p) for(const k in p) s = s.split('{'+k+'}').join(p[k]); return s; }
function num(x, d){ const v = x.toFixed(d); return LANG === 'fr' ? v.replace('.', ',') : v; }
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-ih]').forEach(e => e.innerHTML = t(e.dataset.ih));
  document.querySelectorAll('[data-it]').forEach(e => e.title = t(e.dataset.it));
  document.querySelectorAll('[data-ip]').forEach(e => e.placeholder = t(e.dataset.ip));
  $('lang').value = LANG;
  if(S){ renderList(); renderQuality(); renderResult(); renderSel(); draw(); }
  else $('selName').textContent = t('no_sel');
}
function initLang(){
  let l = null;
  try{ l = localStorage.getItem('llf_lang'); }catch(e){}
  if(!l){ const n = (navigator.language || 'fr').toLowerCase(); l = n.startsWith('ja') ? 'ja' : n.startsWith('fr') ? 'fr' : 'en'; }
  if(!STR[l]) l = 'fr';
  LANG = l; applyLang();
  fetch('/api/lang', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({lang:LANG})}).catch(()=>{});
}
$('lang').addEventListener('change', e => {
  LANG = e.target.value;
  try{ localStorage.setItem('llf_lang', LANG); }catch(err){}
  applyLang();
  fetch('/api/lang', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({lang:LANG})}).catch(()=>{});
});

async function api(path, body){
  const r = await fetch(path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({error:t('invalid')}));
  if(!r.ok || j.error){ showErr(j.error || t('err_code', {c: r.status})); throw new Error(j.error); }
  return j;
}
function showErr(m){ $('err').innerHTML = m ? `<div class="error">${esc(m)}</div>` : ''; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function setState(s){
  const first = !S;
  S = s;
  if(first){ $('dir').value = s.output_dir; }
  for(const im of s.images){
    if(!thumbs[im.id]){ const img = new Image(); img.onload = draw; img.src = '/api/thumb/' + im.id; thumbs[im.id] = img; }
  }
  if(sel && !s.images.find(i => i.id === sel)) sel = null;
  renderList(); renderQuality(); renderResult(); renderJob();
  const n = s.images.length, busy = s.job.running || busyUpload;
  $('bAlign').disabled = busy || n < 2;
  $('bMerge').disabled = busy || !s.images.some(i => i.placed);
  $('bPrev').disabled = busy || !s.images.some(i => i.placed) || n < 1;
  $('empty').style.display = (n === 0 && tab === 'lay') ? 'grid' : 'none';
  $('legend').style.display = (n > 0 && tab === 'lay') ? 'flex' : 'none';
  if(s.preview_version && s.preview_version !== lastPreview){
    lastPreview = s.preview_version; $('pimg').src = '/api/preview.jpg?v=' + s.preview_version;
  }
  updPv();
  renderSel();
  if(first || needFit) needFit = !fit();
  draw();
}
let needFit = false;

function statusDot(im){
  if(im.reference) return 'ref';
  if(im.status === 'aligned') return 'ok';
  if(im.status === 'manual') return 'man';
  if(im.status === 'notfound') return 'bad';
  return 'wait';
}
function renderList(){
  $('list').innerHTML = S.images.map(im => `
    <div class="item ${im.id===sel?'sel':''}" data-id="${im.id}">
      <img src="/api/thumb/${im.id}" alt="">
      <div class="meta"><div class="nm" title="${esc(im.name)}">${esc(im.name)}</div>
      <div class="st"><span class="dot ${statusDot(im)}"></span>${t({ref:'st_ref',ok:'st_aligned',man:'st_manual',bad:'st_notfound',wait:'st_pending'}[statusDot(im)])} · ${im.w}×${im.h}${im.dpi?' · '+Math.round(im.dpi[0])+' dpi':''}</div></div>
      <button class="x" title="${t('remove')}" data-rm="${im.id}">✕</button>
    </div>`).join('');
}
$('list').addEventListener('click', async e => {
  const rm = e.target.closest('[data-rm]');
  if(rm){ e.stopPropagation(); setState(await api('/api/remove', {id: rm.dataset.rm})); needFit = true; draw(); return; }
  const it = e.target.closest('.item'); if(it){ sel = it.dataset.id; renderList(); renderSel(); setTab('lay'); draw(); }
});
function renderSel(){
  const im = S && S.images.find(i => i.id === sel);
  $('selName').textContent = im ? im.name : t('no_sel');
  const dis = !im || S.job.running;
  $('bRotL').disabled = $('bRotR').disabled = dis;
  $('bRef').disabled = dis || im.reference;
}
function renderQuality(){
  const r = S.report;
  if(!r || !r.edges){ $('quality').innerHTML=''; return; }
  const bad = S.images.filter(i => !i.placed);
  const errs = r.edges.map(e => e.ecart_final_px);
  const avg = errs.length ? errs.reduce((a,b)=>a+b,0)/errs.length : 0;
  let h = `<div class="quality">`;
  if(errs.length){
    const cls = avg < 1.5 ? 'good' : 'mid';
    h += t('q_prec', {v: `<span class="${cls}">${num(avg,2)}</span>`, n: r.edges.length});
  }
  if(bad.length) h += `<br><span style="color:var(--bad)">${t('q_bad', {n: bad.length})}</span>`;
  else if(errs.length) h += '<br>' + t('q_all');
  $('quality').innerHTML = h + '</div>';
}
function renderResult(){
  const r = S.result;
  if(!r){ $('result').innerHTML=''; return; }
  $('result').innerHTML = `<div class="result"><b>✔ ${esc(r.name)}</b>
    ${r.width} × ${r.height} px · ${r.dpi? Math.round(r.dpi[0])+' dpi · ':''}${num(r.size_mb,1)} ${t('mb')} · ${r.seconds} s
    <div class="row"><button class="btn small" id="bOpen">${t('open_folder')}</button><a class="btn small" href="/api/result" download>${t('download')}</a></div></div>`;
  $('bOpen').onclick = () => api('/api/open_folder', {});
}
function renderJob(){
  const j = S.job;
  const show = j.running || busyUpload;
  $('ov').style.display = show ? 'grid' : 'none';
  if(j.running){
    $('ovMsg').textContent = j.msg || '…';
    $('ovBar').style.width = Math.round(j.frac*100) + '%';
    $('ovPct').textContent = Math.round(j.frac*100) + ' %';
    $('bCancel').style.display = '';
  }
  if(!j.running && j.done !== lastJobDone){
    if(lastJobDone !== -1){
      if(j.error) showErr(j.error);
      else { showErr(''); if(j.kind === 'align'){ needFit = true; setTab(S.images.every(i=>i.placed) ? 'prev' : 'lay'); } if(j.kind === 'preview' || j.kind === 'merge') setTab('prev'); }
    }
    lastJobDone = j.done;
  }
  clearTimeout(pollTimer);
  pollTimer = setTimeout(refresh, j.running ? 500 : 5000);
}
async function refresh(){ try{ setState(await api('/api/state')); }catch(e){ pollTimer = setTimeout(refresh, 3000); } }

// ---------------- ajout de fichiers
$('drop').onclick = () => $('file').click();
$('file').onchange = e => { upload([...e.target.files]); e.target.value=''; };
let dragDepth = 0;
window.addEventListener('dragenter', e => { if(e.dataTransfer.types.includes('Files')){ dragDepth++; $('dropfull').style.display='grid'; e.preventDefault(); }});
window.addEventListener('dragleave', e => { dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) $('dropfull').style.display='none'; });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('dropfull').style.display='none'; upload([...e.dataTransfer.files]); });

async function upload(files){
  if(!files.length) return;
  busyUpload = true; showErr(''); renderJob();
  $('bCancel').style.display = 'none';
  files.sort((a,b) => a.name.localeCompare(b.name, LANG, {numeric:true}));
  let k = 0;
  for(const f of files){
    k++;
    await new Promise(res => {
      const x = new XMLHttpRequest();
      x.open('POST', '/api/upload?name=' + encodeURIComponent(f.name));
      x.upload.onprogress = ev => { const p = ev.total ? ev.loaded/ev.total : 0;
        $('ovMsg').textContent = t('importing', {name: f.name, k, n: files.length});
        $('ovBar').style.width = Math.round(((k-1) + p*0.6)/files.length*100) + '%';
        $('ovPct').textContent = Math.round(((k-1) + p*0.6)/files.length*100) + ' %'; };
      x.upload.onload = () => { $('ovMsg').textContent = t('reading', {name: f.name, k, n: files.length}); };
      x.onload = () => { let j={}; try{ j = JSON.parse(x.responseText); }catch(e){}
        if(x.status !== 200 || j.error) showErr(j.error || t('import_fail', {name: f.name})); else { S = null; setState(j); }
        res(); };
      x.onerror = () => { showErr(t('import_fail', {name: f.name})); res(); };
      $('ovMsg').textContent = t('importing', {name: f.name, k, n: files.length});
      x.send(f);
    });
  }
  busyUpload = false; needFit = true; refresh();
}

// ---------------- actions
function opts(){ return {rotation: parseFloat($('rot').value)||0, crop: $('crop').checked, background: $('bg').value}; }
$('bAlign').onclick = async () => { showErr(''); setState(await api('/api/align', {})); };
$('bPrev').onclick = async () => { showErr(''); setState(await api('/api/preview', opts())); };
$('bMerge').onclick = async () => { showErr(''); setState(await api('/api/merge', Object.assign(opts(), {format: $('fmt').value, filename: $('name').value, output_dir: $('dir').value}))); };
$('bCancel').onclick = () => api('/api/cancel', {});
$('bRotL').onclick = async () => { setState(await api('/api/rotate', {id: sel, q: -1})); };
$('bRotR').onclick = async () => { setState(await api('/api/rotate', {id: sel, q: 1})); };
$('bRef').onclick = async () => { setState(await api('/api/reference', {id: sel})); };
$('bClear').onclick = async () => { if(!S || !S.images.length || confirmClear()) { setState(await api('/api/clear', {})); setTab('lay'); } };
function confirmClear(){ return window.__noConfirm || confirm(t('confirm_clear')); }
$('tLay').onclick = () => setTab('lay');
$('tPrev').onclick = () => setTab('prev');
$('bFit').onclick = () => { if(tab==='lay'){ fit(); draw(); } else { $('pv').className='fit'; } };
$('b100').onclick = () => { $('pv').className = $('pv').className === 'fit' ? 'full' : 'fit'; };
function updPv(){ const has = S && S.preview_version; $('pvEmpty').style.display = has ? 'none' : 'grid'; $('pimg').style.display = has ? '' : 'none'; }
function setTab(t){
  tab = t;
  $('tLay').classList.toggle('on', t==='lay'); $('tPrev').classList.toggle('on', t==='prev');
  $('cv').style.display = t==='lay' ? 'block' : 'none';
  $('pv').style.display = t==='prev' ? 'block' : 'none';
  $('selTools').style.visibility = t==='lay' ? 'visible' : 'hidden';
  $('b100').style.display = t==='prev' ? '' : 'none';
  if(S){ $('empty').style.display = (S.images.length===0 && t==='lay') ? 'grid':'none'; $('legend').style.display = (S.images.length>0 && t==='lay')?'flex':'none'; }
  updPv();
  if(t==='lay'){ if(needFit || !view) needFit = !fit(); draw(); }
}

// ---------------- disposition (canevas)
const cv = $('cv'), ctx = cv.getContext('2d');
function corners(im){ const T = im.T, w = im.w, h = im.h;
  return [[0,0],[w,0],[w,h],[0,h]].map(([x,y]) => [T[0][0]*x+T[0][1]*y+T[0][2], T[1][0]*x+T[1][1]*y+T[1][2]]); }
function fit(){
  if(!S || !S.images.length){ view = {s:1, x:0, y:0}; return true; }
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const im of S.images) for(const [x,y] of corners(im)){ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); }
  const r = cv.getBoundingClientRect(), pad = 40;
  if(r.width < 20 || r.height < 20) return false;
  const s = Math.min((r.width-2*pad)/(x1-x0), (r.height-2*pad)/(y1-y0));
  view = {s, x: (r.width - s*(x1-x0))/2 - s*x0, y: (r.height - s*(y1-y0))/2 - s*y0};
  return true;
}
let dragging = null;
function draw(){
  if(tab !== 'lay') return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if(cv.width !== Math.round(r.width*dpr) || cv.height !== Math.round(r.height*dpr)){ cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); }
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  if(!S || !view) return;
  const order = S.images.slice().sort((a,b) => (a.id===sel) - (b.id===sel));
  const colors = {ref:'#0b6bcb', ok:'#1f8a4c', man:'#c77700', bad:'#c62f2f', wait:'#8a939d'};
  for(const im of order){
    const T = im.T, ts = im.thumb_scale;
    ctx.setTransform(dpr*view.s*T[0][0], dpr*view.s*T[1][0], dpr*view.s*T[0][1], dpr*view.s*T[1][1],
                     dpr*(view.s*T[0][2]+view.x), dpr*(view.s*T[1][2]+view.y));
    const img = thumbs[im.id];
    ctx.globalAlpha = (dragging && dragging.id === im.id) ? 0.6 : (im.placed || im.id===sel ? 1 : 0.85);
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,im.w,im.h);
    if(img && img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, im.w, im.h);
    ctx.globalAlpha = 1;
    ctx.lineWidth = (im.id === sel ? 3 : 1.5) / (view.s * Math.hypot(T[0][0], T[1][0]));
    ctx.strokeStyle = im.id === sel ? '#0b6bcb' : colors[statusDot(im)];
    ctx.strokeRect(0,0,im.w,im.h);
  }
  // étiquettes
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font = '600 12px "Segoe UI","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif';
  for(const im of order){
    const c = corners(im).map(([x,y]) => [view.s*x+view.x, view.s*y+view.y]);
    const lx = Math.min(...c.map(p=>p[0])) + 6, ly = Math.min(...c.map(p=>p[1])) + 6;
    const label = (S.images.indexOf(im)+1) + '. ' + im.name + (im.reference ? '  ' + t('ref_suffix') : '');
    const w = ctx.measureText(label).width + 12;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(lx, ly, w, 20);
    ctx.fillStyle = colors[statusDot(im)]; ctx.fillRect(lx, ly, 3, 20);
    ctx.fillStyle = '#1f2328'; ctx.fillText(label, lx+7, ly+14);
  }
}
function toWorld(ev){ const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left - view.x)/view.s, (ev.clientY - r.top - view.y)/view.s]; }
function hit(wx, wy){
  const order = S.images.slice().sort((a,b) => (a.id===sel) - (b.id===sel)).reverse();
  for(const im of order){
    const T = im.T, det = T[0][0]*T[1][1]-T[0][1]*T[1][0];
    const dx = wx - T[0][2], dy = wy - T[1][2];
    const x = ( T[1][1]*dx - T[0][1]*dy)/det, y = (-T[1][0]*dx + T[0][0]*dy)/det;
    if(x>=0 && y>=0 && x<=im.w && y<=im.h) return im;
  }
  return null;
}
cv.addEventListener('mousedown', ev => {
  if(!S || !view) return;
  const [wx, wy] = toWorld(ev);
  const im = hit(wx, wy);
  if(im){ sel = im.id; renderList(); renderSel();
    dragging = {id: im.id, sx: ev.clientX, sy: ev.clientY, T0: JSON.parse(JSON.stringify(im.T)), moved:false, ref: im.reference}; }
  else dragging = {pan:true, sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y};
  cv.classList.add('dragging'); draw();
});
window.addEventListener('mousemove', ev => {
  if(!dragging) return;
  const dx = ev.clientX - dragging.sx, dy = ev.clientY - dragging.sy;
  if(dragging.pan){ view.x = dragging.vx + dx; view.y = dragging.vy + dy; draw(); return; }
  if(dragging.ref || S.job.running) return;
  if(Math.abs(dx)+Math.abs(dy) > 2) dragging.moved = true;
  const im = S.images.find(i => i.id === dragging.id);
  im.T = JSON.parse(JSON.stringify(dragging.T0));
  im.T[0][2] += dx/view.s; im.T[1][2] += dy/view.s;
  draw();
});
window.addEventListener('mouseup', async () => {
  if(!dragging) return;
  const d = dragging; dragging = null; cv.classList.remove('dragging');
  if(d.id && d.moved){ const im = S.images.find(i => i.id === d.id); setState(await api('/api/move', {id: d.id, T: im.T})); }
  draw();
});
cv.addEventListener('wheel', ev => {
  if(!view) return; ev.preventDefault();
  const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const f = Math.exp(-ev.deltaY * 0.0015);
  view.x = mx - (mx - view.x)*f; view.y = my - (my - view.y)*f; view.s *= f; draw();
}, {passive:false});
window.addEventListener('resize', () => { fit(); draw(); });
window.addEventListener('keydown', async ev => {
  if(!sel || tab !== 'lay' || ['INPUT','SELECT'].includes(document.activeElement.tagName)) return;
  if(ev.key === 'Delete'){ setState(await api('/api/remove', {id: sel})); }
});
initLang();
setTab('lay');
refresh();
</script>
</body>
</html>
